```yaml
name: HTML Wrapper Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: false
        default: "Budget"
        type: string
      app_version:
        description: "App version"
        required: false
        default: "1.0.1"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare build config
        shell: bash
        run: |
          set -e
          SAFE_VERSION="$(echo "${APP_VERSION}" | tr -cd '0-9A-Za-z._-')"
          [ -z "$SAFE_VERSION" ] && SAFE_VERSION="1.0.1"
          VERSION_CODE="$(date +%s)"
          echo "SAFE_VERSION=$SAFE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building app: ${APP_NAME} v${SAFE_VERSION}"

      - name: Apply app name and version
        shell: bash
        run: |
          set -e
          ESCAPED_NAME="$(printf '%s' "${APP_NAME}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g' -e "s/'/\\\\'/g" -e 's/[\/&|]/\\&/g')"
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${ESCAPED_NAME}\"|" app/src/main/AndroidManifest.xml
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i "s|versionName = \"[^\"]*\"|versionName = \"${SAFE_VERSION}\"|" app/build.gradle.kts
            sed -i "s|versionCode = [0-9]*|versionCode = ${VERSION_CODE}|" app/build.gradle.kts
          fi

      - name: Apply custom icon (optional)
        shell: bash
        run: |
          if [ -f build-icon.png ]; then
            echo "Custom icon found, applying."
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "app/src/main/res/$d"
              cp build-icon.png "app/src/main/res/$d/ic_launcher.png"
              cp build-icon.png "app/src/main/res/$d/ic_launcher_round.png"
            done
            if [ -f app/src/main/AndroidManifest.xml ] && ! grep -q 'android:icon=' app/src/main/AndroidManifest.xml; then
              sed -i 's|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' app/src/main/AndroidManifest.xml
            fi
          else
            echo "No build-icon.png found, using default icon."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: dist/app-debug.apk
          if-no-files-found: error
```