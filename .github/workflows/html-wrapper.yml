name: Build APK (HTML Wrapper)
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App display name'
        required: false
        default: 'My App'
      app_version:
        description: 'App version'
        required: false
        default: '1.0.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Build APK
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_VERSION: ${{ github.event.inputs.app_version }}
        run: |
          export CI=true
          export CORDOVA_NO_TELEMETRY=1
          export CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL=https://services.gradle.org/distributions/gradle-8.7-all.zip
          APP_ID="com.wrapper.app$(date +%s | tail -c 7)"
          SAFE_NAME="${APP_NAME:-My App}"
          SAFE_VERSION="${APP_VERSION:-1.0.0}"
          cd /tmp
          cordova create app "$APP_ID" "$SAFE_NAME" --no-telemetry
          rm -rf app/www/*
          cp -R $GITHUB_WORKSPACE/* app/www/ || true
          if [ -f "$GITHUB_WORKSPACE/build-icon.png" ]; then cp "$GITHUB_WORKSPACE/build-icon.png" app/icon.png || true; fi
          cd app
          sed -i "s/version=\"1.0.0\"/version=\"$SAFE_VERSION\"/g" config.xml
          sed -i 's/<\/widget>/\n    <allow-navigation href="*" \/>\n    <allow-intent href="*" \/>\n<\/widget>/g' config.xml
          if [ -f icon.png ]; then sed -i 's/<\/widget>/\n    <icon src="icon.png" \/>\n<\/widget>/g' config.xml; fi
          cordova plugin add cordova-plugin-inappbrowser --no-telemetry || true
          cordova platform add android@13.0.0 --no-telemetry
          cordova build android --no-telemetry
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: /tmp/app/platforms/android/app/build/outputs/apk/debug/app-debug.apk